info:
  name: Create tour
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}/tours"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Autumn Tour 2027",
        "start": "2027-10-13",
        "end": "2027-10-18"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
