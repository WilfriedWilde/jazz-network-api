info:
  name: Update tour name
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseURL}}/tours/1"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "New tour name"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
